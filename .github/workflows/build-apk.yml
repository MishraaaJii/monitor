name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        working-directory: ./TimeLedgerAppBlocker/TimeLedgerAppBlocker
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./TimeLedgerAppBlocker/TimeLedgerAppBlocker
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: TimeLedgerAppBlocker/TimeLedgerAppBlocker/app/build/outputs/apk/**/*.apk
